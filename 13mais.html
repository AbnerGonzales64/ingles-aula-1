<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula 1 — Hello, neighbour! — Dia 1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;background:#fdfdfb;color:#1d2b3a;font-size:18px;line-height:1.4}
header{position:sticky;top:0;background:#1f5fa8;color:#fff;padding:10px 14px;z-index:5}header small{opacity:.85}.bar{height:10px;background:#ffffff44;border-radius:5px;margin-top:6px}.bar i{display:block;height:100%;background:#f2b134;border-radius:5px;width:0;transition:width .3s}
main{max-width:560px;margin:auto;padding:14px 14px 120px}h1{color:#1f5fa8;font-size:24px;margin:6px 0 10px}.ins{background:#fff7e3;border-left:5px solid #f2b134;padding:10px 12px;border-radius:8px;margin:10px 0}
.q,.card{background:#fff;border:2px dashed #9aa5b1;border-radius:12px;padding:12px;margin:14px 0}label{display:block;padding:12px;margin:6px 0;border:1px solid #d9dde2;border-radius:8px;background:#fff}
input[type=text],input[type=number],select,textarea{width:100%;font-size:18px;padding:12px;border:2px solid #9aa5b1;border-radius:8px;margin:6px 0;background:#fff;font-family:inherit}
button{width:100%;font-size:20px;padding:15px;background:#1f5fa8;color:#fff;border:0;border-radius:12px;margin:8px 0;cursor:pointer}button.alt{background:#f2b134;color:#1d2b3a}button:disabled{background:#b8c2cc;color:#eef}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fdfdfbee;border-top:1px solid #d9dde2;padding:8px 14px}.nav div{max-width:560px;margin:auto;display:flex;gap:10px}.nav button{margin:0}.nav #back{flex:0 0 30%;background:#e6ebf0;color:#1d2b3a}
.ok{background:#e3f5e7!important;border-color:#2c7a3f!important}.no{background:#fbe5e2!important;border-color:#c0392b!important}.hid{display:none}.res{text-align:center;font-size:20px}
video{width:100%;border-radius:10px;background:#000}audio{width:100%}.poem{font-size:22px;font-weight:600;color:#1f5fa8;text-align:center;line-height:1.7}
.chips span{display:inline-block;padding:10px 14px;margin:4px;border-radius:20px;background:#1f5fa8;color:#fff;font-size:18px;cursor:pointer}.chips span.used{opacity:.25}.ans{min-height:44px;border-bottom:2px solid #9aa5b1;padding:6px;font-size:19px}
.warn{background:#fbe5e2;border-left:5px solid #c0392b;padding:10px;border-radius:8px}.small{font-size:15px;color:#5a6876}</style></head><body>
<header><b>Aula 1 — Hello, neighbour!</b> · <small id="tname"></small><div class="bar"><i id="bar"></i></div><small id="pc"></small></header>
<main id="m"></main><div class="nav"><div><button id="back">Voltar</button><button id="next">Próximo</button></div></div>
<script>
const BAND='13',AUDIO='media/ana.mp3',VIDS={"parte1":"media/parte1.mp4","parte2":"media/parte2.mp4","parte3":"media/parte3.mp4"};
const TURMA={'8':'Turma 0 a 8 anos – Gramática','12':'Turma 9 a 12 anos – Gramática e Lógica','13':'Turma 13+ anos – Gramática, Lógica e Retórica'}[BAND];
const L=[["Qual frase está CERTA?",["I from Brazil.","I am from Brazil.","Am from Brazil."],1],["Qual frase está CERTA?",["My name Ana.","Name is Ana.","My name is Ana."],2],["Em \"I live in apartment four\", qual palavra diz QUEM?",["I","live","apartment"],0],["\"I\" quer dizer...",["meu, minha","eu","você"],1],["\"My\" quer dizer...",["eu","obrigado","meu, minha"],2],["Monte a frase certa com estas palavras: name / Ana / my / is",["Name my is Ana.","My name is Ana.","Is my name Ana."],1]];
const R=[["A vizinha bate à porta. O que você diz primeiro?",["Thank you!","Hello!","Nice to meet you."],1],["Como você diz seu nome?",["My name is Ana.","I name Ana.","Name is Ana."],0],["Ela pergunta de onde você é. Você responde:",["I live in Brazil.","I from Brazil.","I am from Brazil."],2],["Para dizer onde mora:",["I live in apartment four.","I am apartment four.","My apartment four."],0],["Ela te dá uma torta. Você diz:",["Hello!","Thank you for the pie!","My name is pie."],1],["Qual é a ordem certa da apresentação?",["Thank you, Hello, My name is...","Hello, My name is..., I am from..., I live in..., Nice to meet you, Thank you","Nice to meet you, Hello, I live in..."],1]];
const MODEL=["Hello!","My name is Ana.","I am from Brazil.","I live in apartment four.","Nice to meet you.","Thank you for the pie!"];
const ERR=[["I from Brazil.","I am from Brazil."],["My name Ana.","My name is Ana."],["Live in apartment four.","I live in apartment four."],["I name is Kate.","My name is Kate."]];
const BUILD=[[["is","name","my","Kate"],"My name is Kate."],[["Brazil","am","I","from"],"I am from Brazil."],[["in","I","apartment","live","five"],"I live in apartment five."],[["to","you","nice","meet"],"Nice to meet you."]];
const CHECK=["Cumprimento: Hello!","Nome: My name is...","De onde sou: I am from...","Onde moro: I live in...","Prazer: Nice to meet you.","Agradecimento: Thank you..."];
const PRON=["Saiu o ar no H de hello?","name terminou em M, sem o \"i\"?","A língua apareceu entre os dentes no thank you?"];
function blob(k){return VIDS[k]}
const KEY='aula1dia1_online_'+BAND;let S=JSON.parse(localStorage.getItem(KEY)||'null')||{i:0,done:{},nome:'',idade:'',cedo:false,notas:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),$=id=>document.getElementById(id),norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function steps(){const a=['inicio','v1'];if(BAND=='8')return a.concat(['recita','fim']);a.push('v2','logica');if(BAND=='13')a.push('v3','fala','retorica');
 a.push('p12');if(!S.cedo){a.push('p3','p4','p5');if(BAND=='13')a.push('p6','p7','p8','p9')}a.push('fim');return a}
const audio=()=>'<audio controls preload="auto" src="'+AUDIO+'"></audio><button class="alt" onclick="let a=this.previousElementSibling;a.currentTime=0;a.play()">🔁 Ouvir a Ana de novo</button>';
const box=(id,t)=>'<label><input type="checkbox" id="'+id+'" '+(S.done[id]?'checked':'')+' onchange="S.done[this.id]=this.checked;save();upd()"> '+t+'</label>';
const vid=(k,t,after)=>({t,h:()=>'<div class="ins">'+after[0]+'</div><video id="vv" controls playsinline preload="metadata" src="'+blob(k)+'"></video><p class="small">O botão Próximo libera quando o vídeo terminar.</p>'+box('viu_'+k,'Já assisti este vídeo inteiro'),
 init:()=>{const v=$('vv');v.addEventListener('timeupdate',()=>{if(v.duration&&v.currentTime/v.duration>.95&&!S.done['viu_'+k]){S.done['viu_'+k]=1;$('viu_'+k).checked=true;save();upd()}})},ok:()=>S.done['viu_'+k]});
function quiz(Q,k,t,pass){return{t,h:()=>'<div class="ins">Acerte <b>4 de 6</b> para passar. Pode tentar quantas vezes quiser.</div>'+Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<label id="'+k+i+'_'+j+'"><input type="radio" name="'+k+i+'" value="'+j+'"> '+'abc'[j]+') '+o+'</label>').join('')+'</div>').join('')+'<button id="nota">Ver minha nota</button><div id="res" class="card res hid"></div><button id="again" class="alt hid">Tentar de novo</button>'+(S.notas[k]>=4?'<div class="card res ok">✅ Você já passou neste teste ('+S.notas[k]+' de 6).</div>':''),
 init:()=>{$('nota').onclick=()=>{const a=Q.map((q,i)=>document.querySelector('input[name='+k+i+']:checked'));if(a.some(x=>!x)){alert('Responda todas as perguntas.');return}
 let s=0;Q.forEach((q,i)=>{const c=+a[i].value;$(k+i+'_'+q[2]).className='ok';if(c==q[2])s++;else $(k+i+'_'+c).className='no'});const p=s>=4;S.notas[k]=Math.max(S.notas[k]||0,s);(S.tent=S.tent||{})[k]=(S.tent[k]||0)+1;save();
 const r=$('res');r.className='card res '+(p?'ok':'no');r.innerHTML=S.nome+', você acertou <b>'+s+' de 6</b>.<br>'+(p?'🎉 Parabéns! '+pass:'Ainda não foi desta vez. Veja o vídeo de novo (botão Voltar) e tente outra vez!');$('again').classList.toggle('hid',p);$('nota').disabled=true;r.scrollIntoView({behavior:'smooth'});upd()};
 $('again').onclick=()=>render()},ok:()=>S.notas[k]>=4}}
function typed(items,k,t,ins,pre){return{t,h:()=>'<div class="ins">'+ins+'</div>'+(pre||'')+items.map((it,i)=>'<div class="q"><b>'+(i+1)+'. '+it[0]+'</b><input type="text" autocapitalize="sentences" id="'+k+i+'" value="'+((S.done[k+'v']||[])[i]||'').replace(/"/g,'&quot;')+'"></div>').join('')+'<button id="cf">Conferir</button><div id="res" class="card res hid"></div>',
 init:()=>{$('cf').onclick=()=>{let s=0,v=[];items.forEach((it,i)=>{const e=$(k+i);v.push(e.value);const g=norm(e.value)==norm(it[1]);if(g)s++;e.className=g?'ok':'no'});S.done[k+'v']=v;
 const all=s==items.length;if(all)S.done[k]=1;save();const r=$('res');r.className='card res '+(all?'ok':'no');r.innerHTML=all?'🎉 Tudo certo!':'Você acertou '+s+' de '+items.length+'. Arrume as frases em vermelho e confira de novo.'+'<br><button class="alt" onclick="showAns()">Ver as respostas</button><div id="ansl" class="hid small">'+items.map((it,i)=>(i+1)+'. '+it[1]).join('<br>')+'</div>';upd()}},ok:()=>S.done[k]}}
function showAns(){$('ansl').classList.remove('hid');S.done[cur().id]=1;save();upd()}
const ST={
inicio:{t:'Boas-vindas',h:()=>'<h1>👋 Olá! Bem-vindo à Aula 1</h1><div class="ins">Hoje você vai aprender a se apresentar ao vizinho em inglês. É só seguir as telas, uma de cada vez, e apertar <b>Próximo</b>.</div><div class="card"><b>'+TURMA+'</b><br><br><b>Seu nome</b><input type="text" id="nome" value="'+S.nome+'" placeholder="Escreva seu nome"><b>Sua idade</b><input type="number" id="idade" inputmode="numeric" min="3" max="99" value="'+S.idade+'" placeholder="Ex.: 10">'+
 (BAND!='8'?'<label><input type="checkbox" id="cedo" '+(S.cedo?'checked':'')+'> Entrei no curso antes dos 9 anos (já fiz esta aula na turma de até 8)</label>':'')+'<div id="aviso"></div></div><p class="small">Seu progresso fica salvo neste celular. Se fechar, é só abrir o link de novo.</p>',
 init:()=>{const f=()=>{S.nome=$('nome').value.trim();S.idade=$('idade').value;if($('cedo'))S.cedo=$('cedo').checked;save();const a=+S.idade,w=$('aviso');let m='';
 if(a){const ok=BAND=='8'?a<=8:BAND=='12'?a>=9&&a<=12:a>=13;if(!ok)m='⚠️ Este arquivo é da <b>'+TURMA+'</b>, e você tem '+a+' anos. Peça o arquivo da sua turma'+(a<=8?' (0 a 8 anos)':a<=12?' (9 a 12 anos)':' (13+ anos)')+'. Se quiser, pode continuar mesmo assim.'}
 w.innerHTML=m?'<div class="warn">'+m+'</div>':'';upd()};['nome','idade','cedo'].forEach(x=>$(x)&&($(x).oninput=$(x).onchange=f));f()},ok:()=>S.nome&&+S.idade>0},
v1:vid('parte1','Vídeo 1 — Gramática',['Assista ao vídeo e repita em voz alta junto com o Abner. '+(BAND=='8'?'Chame um adulto para assistir com você!':'Quando o vídeo terminar, aperte Próximo.')]),
recita:{t:'Recitação',h:()=>'<div class="ins">Agora cante a recitação de novo com um adulto, batendo palmas. Troque <b>Ana</b> pelo seu nome! Ouça a Ana primeiro.</div>'+audio()+'<div class="card poem">'+MODEL.join('<br>')+'</div>'+box('recitei','Cantei a recitação com um adulto 👏'),ok:()=>S.done.recitei},
v2:vid('parte2','Vídeo 2 — Lógica',['Agora a parte de Lógica. No final, o Abner pede para você fazer o teste: ele é a próxima tela.']),
logica:quiz(L,'logica','Teste de Lógica',BAND=='12'?'<b>Aula 2 liberada!</b> Agora vamos para a prática extra.':'Agora vamos para a Retórica.'),
v3:vid('parte3','Vídeo 3 — Retórica',['Muito bem no teste! Agora a parte de Retórica: você vai ser a Ana.']),
fala:{t:'Tarefa de fala',h:()=>'<div class="ins">Grave de <b>20 a 30 segundos</b> se apresentando ao vizinho, com o seu nome. Depois ouça e confira com o modelo da Ana e com a lista abaixo.</div><b>Modelo da Ana</b>'+audio()+'<div class="card poem">'+MODEL.join('<br>')+'</div>'+
 '<div class="card"><b>🎙️ Gravar aqui</b><p class="small">Se o gravador não funcionar no seu celular, grave com o gravador do próprio celular ou um áudio do WhatsApp.</p><button id="rec">● Começar a gravar</button><audio id="meu" controls class="hid"></audio><div id="recmsg" class="small"></div></div>'+
 '<div class="card"><b>Minha gravação tem…</b>'+CHECK.map((c,i)=>box('ck'+i,c)).join('')+'<b>Pronúncia</b>'+PRON.map((c,i)=>box('pr'+i,c)).join('')+'</div>'+box('gravei','<b>Já gravei e conferi</b>'),
 init:()=>{let mr=null,ch=[];$('rec').onclick=async()=>{if(mr&&mr.state=='recording'){mr.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);ch=[];mr.ondataavailable=e=>ch.push(e.data);
 mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());const m=$('meu');m.src=URL.createObjectURL(new Blob(ch,{type:mr.mimeType}));m.classList.remove('hid');$('rec').textContent='● Gravar de novo';$('recmsg').textContent='Ouça sua gravação acima e confira a lista.'};mr.start();$('rec').textContent='■ Parar';$('recmsg').textContent='Gravando… fale sua apresentação.'}
 catch(e){$('recmsg').textContent='Não deu para gravar aqui ('+e.name+'). Use o gravador do celular ou um áudio do WhatsApp e depois marque a lista.'}}},ok:()=>S.done.gravei},
retorica:quiz(R,'retorica','Teste de Retórica','<b>Aula 2 liberada!</b> Agora vamos para a prática extra.'),
p12:{t:'Prática extra 1 e 2',h:()=>'<div class="ins">Prática extra de hoje: '+(S.cedo?'atividades 1 e 2 (1 a 4 min).':BAND=='12'?'atividades 1 a 5 (7 a 11 min).':'atividades 1 a 9 (24 a 29 min).')+'</div><div class="card"><b>1.</b> Recite o texto com palmas, uma vez, com o seu nome.<div class="poem">'+MODEL.join('<br>')+'</div></div>'+box('a1','Fiz a atividade 1')+'<div class="card"><b>2.</b> Diga <b>thank you</b> 5 vezes com a língua entre os dentes, olhando no espelho.</div>'+box('a2','Fiz a atividade 2'),ok:()=>S.done.a1&&S.done.a2},
p3:{t:'Prática 3 — Ouvir e repetir',h:()=>'<div class="ins"><b>3.</b> Ouça o modelo da Ana e repita frase por frase, duas vezes. Pause o áudio depois de cada frase.</div>'+audio()+'<div class="card poem">'+MODEL.join('<br>')+'</div>'+box('a3','Repeti tudo duas vezes'),ok:()=>S.done.a3},
p4:typed(ERR,'a4','Prática 4 — Caça ao erro','<b>4.</b> Cada frase tem um erro. Escreva a frase certa embaixo.'),
p5:{t:'Prática 5 — Montar frase',h:()=>'<div class="ins"><b>5.</b> Toque nas palavras na ordem certa para montar a frase. Errou? Toque em Apagar.</div>'+BUILD.map((b,i)=>'<div class="q"><b>'+(i+1)+'.</b><div class="ans" id="b'+i+'"></div><div class="chips" id="c'+i+'">'+b[0].map(w=>'<span>'+w+'</span>').join('')+'</div><button class="alt" onclick="clr('+i+')">Apagar</button></div>').join('')+'<button id="cf">Conferir</button><div id="res" class="card res hid"></div>',
 init:()=>{BUILD.forEach((b,i)=>$('c'+i).querySelectorAll('span').forEach(s=>s.onclick=()=>{if(s.classList.contains('used'))return;s.classList.add('used');$('b'+i).textContent+=($('b'+i).textContent?' ':'')+s.textContent}));
 $('cf').onclick=()=>{let n=0;BUILD.forEach((b,i)=>{const g=norm($('b'+i).textContent)==norm(b[1]);if(g)n++;$('b'+i).className='ans '+(g?'ok':'no')});const r=$('res');r.className='card res '+(n==4?'ok':'no');r.innerHTML=n==4?'🎉 Tudo certo!':'Você acertou '+n+' de 4. Apague as vermelhas e tente de novo.';if(n==4){S.done.a5=1;save()}upd()}},ok:()=>S.done.a5},
p6:typed(MODEL.map((m,i)=>['Frase '+(i+1),m]),'a6','Prática 6 — Ditado','<b>6.</b> Ouça o áudio da Ana e escreva cada frase. Pode pausar e ouvir de novo quantas vezes quiser.',audio()),
p7:{t:'Prática 7 — Troca de dados',h:()=>'<div class="ins"><b>7.</b> Reescreva a apresentação da Ana 3 vezes, mudando o <b>nome</b>, a <b>cidade/país</b> e o <b>apartamento</b>.</div><div class="card small">Modelo: '+MODEL.join(' ')+'</div>'+[0,1,2].map(i=>'<b>Versão '+(i+1)+'</b><textarea rows="4" id="t'+i+'">'+((S.done.a7v||[])[i]||'')+'</textarea>').join('')+'<button id="cf">Conferir</button><div id="res" class="card res hid"></div>',
 init:()=>{$('cf').onclick=()=>{const v=[0,1,2].map(i=>$('t'+i).value);S.done.a7v=v;let n=0;const need=['hello','my name is','i am from','i live in apartment','nice to meet you','thank you'];
 v.forEach((x,i)=>{const t=norm(x),g=need.every(p=>t.includes(p))&&!/my name is ana\b/.test(t);if(g)n++;$('t'+i).className=g?'ok':'no'});S.done.a7=n==3;save();const r=$('res');r.className='card res '+(n==3?'ok':'no');r.innerHTML=n==3?'🎉 Ótimo! As 3 versões têm todas as partes.':'Cada versão precisa das 6 partes (Hello, My name is, I am from, I live in apartment, Nice to meet you, Thank you) e de um nome diferente de Ana.';upd()}},ok:()=>S.done.a7},
p8:{t:'Prática 8 — Gravar 2 vezes',h:()=>'<div class="ins"><b>8.</b> Grave sua apresentação 2 vezes (gravador do celular ou áudio do WhatsApp) e veja na lista qual ficou melhor.</div><div class="card"><b>Gabarito</b>'+CHECK.map(c=>'<div>☐ '+c+'</div>').join('')+'<b>Pronúncia</b>'+PRON.map(c=>'<div>☐ '+c+'</div>').join('')+'</div>'+box('a8','Gravei 2 vezes e escolhi a melhor'),ok:()=>S.done.a8},
p9:{t:'Prática 9 — De cor',h:()=>'<div class="ins"><b>9.</b> Recite o texto de cor, sem olhar, até sair sem erro. Toque abaixo só se precisar espiar.</div><button class="alt" onclick="this.nextElementSibling.classList.toggle(\'hid\')">👀 Espiar o texto</button><div class="card poem hid">'+MODEL.join('<br>')+'</div>'+box('a9','Recitei de cor sem erro'),ok:()=>S.done.a9},
fim:{t:'Parabéns!',h:()=>{S.fim=1;save();const n=S.notas,tr=S.tent||{};return '<h1>🎉 Parabéns, '+S.nome+'!</h1><div class="ins">Você terminou o Dia 1 da Aula 1 — <i>Hello, neighbour!</i></div><div class="card"><b>Resumo</b><br>Nome: '+S.nome+'<br>Idade: '+S.idade+'<br>Turma: '+TURMA+(S.cedo?'<br>Entrou cedo: sim':'')+
 (n.logica!=null?'<br>Teste de Lógica: '+n.logica+' de 6 ('+tr.logica+' tentativa'+(tr.logica>1?'s':'')+')':'')+(n.retorica!=null?'<br>Teste de Retórica: '+n.retorica+' de 6 ('+tr.retorica+' tentativa'+(tr.retorica>1?'s':'')+')':'')+(BAND!='8'?'<br>Prática extra: feita ✅':'<br>Recitação: feita ✅')+'</div>'+
 (BAND!='8'?'<div class="card res ok"><b>Aula 2 liberada!</b></div>':'<div class="card res ok">See you tomorrow! 👋</div>')+'<p class="small">Tire um print desta tela e mande para o professor. Amanhã, repita a prática extra.</p><button class="alt" onclick="if(confirm(\'Apagar todo o progresso e começar de novo?\')){localStorage.removeItem(KEY);location.reload()}">Começar tudo de novo</button>'},ok:()=>false}};
const cur=()=>({id:steps()[S.i],...ST[steps()[S.i]]});function clr(i){$('b'+i).textContent='';$('b'+i).className='ans';$('c'+i).querySelectorAll('span').forEach(s=>s.classList.remove('used'))}
function upd(){const a=steps(),c=cur();$('next').disabled=!c.ok();$('next').classList.toggle('hid',c.id=='fim');$('back').classList.toggle('hid',S.i==0);$('bar').style.width=(100*S.i/(a.length-1))+'%';$('pc').textContent='Etapa '+(S.i+1)+' de '+a.length+' · '+c.t;$('tname').textContent=TURMA}
function render(){const a=steps();if(S.i>=a.length)S.i=a.length-1;const c=cur();$('m').innerHTML=c.h();c.init&&c.init();upd();scrollTo(0,0)}
$('next').onclick=()=>{if(!cur().ok())return;S.i++;save();render()};$('back').onclick=()=>{if(S.i>0){S.i--;save();render()}};render();
</script></body></html>
